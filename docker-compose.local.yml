# Stack local para desarrollo y pruebas
# NO USAR EN PRODUCCION (usar Dokploy en su lugar)
#
# Uso:
#   cp .env.example .env
#   docker compose -f docker-compose.local.yml up -d --build
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_db}
      POSTGRES_USER: ${DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hotel_user} -d ${DB_NAME:-hotel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-hotel_db}
      - DB_USER=${DB_USER:-hotel_user}
      - DB_PASSWORD=${DB_PASSWORD:-hotel_password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-60}
      - DB_CONN_HEALTH_CHECKS=${DB_CONN_HEALTH_CHECKS:-True}
      - BEHIND_PROXY=${BEHIND_PROXY:-False}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY:-True}
      - CSRF_COOKIE_HTTPONLY=${CSRF_COOKIE_HTTPONLY:-True}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Lax}
      - CSRF_COOKIE_SAMESITE=${CSRF_COOKIE_SAMESITE:-Lax}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-False}
      - ADMIN_PATH=${ADMIN_PATH:-admin/}
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      - PGPASSWORD=${DB_PASSWORD:-hotel_password}
    volumes:
      - ./backups:/backups
    networks:
      - hotel_network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U ${DB_USER:-hotel_user} -d ${DB_NAME:-hotel_db} -F c -f /backups/hotel_db_$$(date +\%Y\%m\%d_\%H\%M\%S).dump
          find /backups -name "*.dump" -mtime +14 -delete
          sleep 86400
        done

volumes:
  postgres_data:
  media_data:

networks:
  hotel_network:
    driver: bridge
